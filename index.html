<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El jardín de las delicias · Visor</title><style>*{box-sizing:border-box}body{margin:0;background:#141310;color:#f7efd9;font:14px system-ui}main{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}main:active{cursor:grabbing}img{position:absolute;transform-origin:0 0;max-width:none;pointer-events:none;user-select:none}nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;background:#24221fee;padding:8px;border:1px solid #796c49;border-radius:15px;box-shadow:0 8px 30px #0008}button{background:none;border:0;color:inherit;font:inherit;min-width:40px;height:40px;border-radius:8px;cursor:pointer}button:hover,button:focus-visible{background:#ffffff24}output{min-width:48px;text-align:center}aside{position:fixed;top:15px;left:50%;transform:translateX(-50%);width:max-content;max-width:95vw;text-align:center;font-size:12px;background:#24221fe0;padding:10px;border-radius:10px;pointer-events:none}#status{position:fixed;top:45%;width:100%;text-align:center}</style><main tabindex="0" aria-label="Imagen ampliable"><img alt="Infografía El placer en castigo: El jardín de las delicias" draggable="false"></main><p id="status" role="status">Cargando imagen original…</p><aside>Rueda o dos dedos para ampliar · Arrastra para explorar</aside><nav aria-label="Controles de zoom"><button id="minus" aria-label="Alejar">−</button><output>—</output><button id="plus" aria-label="Acercar">+</button><button id="fit">Ajustar</button><button id="actual" title="Tamaño original">1:1</button><button id="full" aria-label="Pantalla completa">⛶</button></nav><script>
const v=document.querySelector('main'),im=document.querySelector('img'),st=document.querySelector('#status'),ps=new Map();let s=1,x=0,y=0,min=.01;
function draw(){if(!im.naturalWidth)return;const w=im.naturalWidth*s,h=im.naturalHeight*s;x=w<innerWidth?(innerWidth-w)/2:Math.max(innerWidth-w,Math.min(0,x));y=h<innerHeight?(innerHeight-h)/2:Math.max(innerHeight-h,Math.min(0,y));im.style.transform=`translate(${x}px,${y}px) scale(${s})`;document.querySelector('output').textContent=Math.round(s*100)+'%'}
function fit(){if(!im.naturalWidth)return;min=Math.min(innerWidth/im.naturalWidth,innerHeight/im.naturalHeight);s=min;draw()}
function zoom(n,cx=innerWidth/2,cy=innerHeight/2){const ns=Math.max(min,Math.min(4,n)),r=ns/s;x=cx-(cx-x)*r;y=cy-(cy-y)*r;s=ns;draw()}
im.onload=()=>{st.hidden=true;fit()};im.onerror=()=>st.textContent='No se pudo cargar la imagen. Recarga la página.';
async function load(){try{const data=document.querySelector('#image-data');if(data){im.src=data.textContent;return}const parts=await Promise.all([0,1,2].map(async i=>{const r=await fetch('imagen-'+i+'.bin');if(!r.ok)throw Error();return r.arrayBuffer()}));im.src=URL.createObjectURL(new Blob(parts,{type:'image/jpeg'}))}catch{st.textContent='No se pudo cargar la imagen. Revisa tu conexión y recarga.'}}
v.addEventListener('wheel',e=>{e.preventDefault();zoom(s*Math.exp(-e.deltaY*.002),e.clientX,e.clientY)},{passive:false});v.onpointerdown=e=>{v.setPointerCapture(e.pointerId);ps.set(e.pointerId,{x:e.clientX,y:e.clientY})};v.onpointermove=e=>{if(!ps.has(e.pointerId))return;const before=[...ps.values()],old=ps.get(e.pointerId);ps.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ps.size===1){x+=e.clientX-old.x;y+=e.clientY-old.y}else if(ps.size===2){const after=[...ps.values()],a=before[0],b=before[1],c=after[0],d=after[1],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist)zoom(s*Math.hypot(c.x-d.x,c.y-d.y)/dist,(a.x+b.x)/2,(a.y+b.y)/2);x+=(c.x+d.x-a.x-b.x)/2;y+=(c.y+d.y-a.y-b.y)/2}draw()};v.onpointerup=v.onpointercancel=e=>ps.delete(e.pointerId);v.ondblclick=e=>zoom(s<min*2?min*3:min,e.clientX,e.clientY);
document.querySelector('#plus').onclick=()=>zoom(s*1.4);document.querySelector('#minus').onclick=()=>zoom(s/1.4);document.querySelector('#fit').onclick=fit;document.querySelector('#actual').onclick=()=>zoom(1);document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.querySelector('aside').textContent='Pantalla completa no disponible en este navegador.'}};window.onresize=()=>{if(!im.naturalWidth)return;min=Math.min(innerWidth/im.naturalWidth,innerHeight/im.naturalHeight);s=Math.max(s,min);draw()};window.onkeydown=e=>{if(['+','=','-','0','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key==='+'||e.key==='=')zoom(s*1.4);if(e.key==='-')zoom(s/1.4);if(e.key==='0')fit();if(e.key==='ArrowLeft')x+=100;if(e.key==='ArrowRight')x-=100;if(e.key==='ArrowUp')y+=100;if(e.key==='ArrowDown')y-=100;draw()};im.src="infografia.jpg";
</script></html>
